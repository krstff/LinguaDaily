{% extends "base.html" %}

{% block title %}Logs — LinguaDaily{% endblock %}

{% block content %}
<h1>Logs</h1>
<p class="subtitle">Live tail of lingua.log — auto-refreshes every 3s</p>

<div class="toolbar">
  <select id="log-level-filter" name="level">
    <option value="ALL" selected>All Levels</option>
    <option value="DEBUG">Debug</option>
    <option value="INFO">Info</option>
    <option value="WARNING">Warning</option>
    <option value="ERROR">Error</option>
  </select>

  <label style="display:flex;align-items:center;gap:6px;text-transform:none;font-size:13px;color:var(--fg);margin:0;">
    <input type="checkbox" id="follow-toggle" checked style="width:auto;"> Follow
  </label>

</div>

<div class="log-container" id="log-output">Loading…</div>

<script>
(function() {
  const container = document.getElementById('log-output');
  const filter    = document.getElementById('log-level-filter');
  const follow    = document.getElementById('follow-toggle');

  async function fetchLogs() {
    const level = filter.value;
    try {
      const resp = await fetch(`/api/logs/tail?level=${encodeURIComponent(level)}`);
      container.innerHTML = await resp.text();
    } catch(e) {
      // keep existing content on error
    }

    // Auto-scroll when follow is enabled
    if (follow.checked) {
      container.scrollTop = container.scrollHeight;
    }
  }

  // Initial load + every 3s
  fetchLogs();
  setInterval(fetchLogs, 3000);
})();
</script>
{% endblock %}
