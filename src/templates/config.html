{% extends "base.html" %}

{% block title %}Config — LinguaDaily{% endblock %}

{% block content %}
<h1>Config Editor</h1>
<p class="subtitle">Edit config.json directly — changes are hot-reloaded into the running daemon</p>

<div class="toolbar">
  <button class="btn btn-primary" hx-post="/api/config/save"
          hx-include="#config-editor"
          hx-target="#config-status"
          hx-swap="innerHTML">Save to Disk</button>
  <span id="config-status"></span>
</div>

<div class="form-row">
  <textarea id="config-editor" name="config_json" rows="32" spellcheck="false">{{ config_text }}</textarea>
</div>

<script>
// Pretty-print on load
(function() {
  const ta = document.getElementById('config-editor');
  try {
    const parsed = JSON.parse(ta.value);
    ta.value = JSON.stringify(parsed, null, 2);
  } catch(e) {}
})();
</script>
{% endblock %}
