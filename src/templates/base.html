<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LinguaDaily{% endblock %}</title>
<style>
/* ── Gruvbox dark palette ──────────────────────────────── */
:root {
  --bg:      #282828;
  --bg0:     #1d2021;
  --bg1:     #3c3836;
  --bg2:     #504945;
  --fg:      #ebdbb2;
  --fg_dim:  #928374;
  --green:   #b8bb26;
  --red:     #fb4934;
  --yellow:  #fabd2f;
  --blue:    #83a598;
  --purple:  #d3869b;
  --aqua:    #8ec07c;
  --orange:  #fe8019;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
}

/* ── Top navigation bar ─────────────────────────────────── */
nav {
  background: var(--bg0);
  border-bottom: 2px solid var(--bg2);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 48px;
  position: sticky;
  top: 0;
  z-index: 100;
}

nav .logo {
  color: var(--green);
  font-weight: bold;
  font-size: 15px;
  margin-right: 32px;
  white-space: nowrap;
}

nav .logo span { color: var(--fg_dim); }

nav a {
  color: var(--fg_dim);
  text-decoration: none;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 13px;
  transition: all .15s;
}

nav a:hover { background: var(--bg1); color: var(--fg); }
nav a.active { background: var(--bg1); color: var(--blue); }

/* ── Main content area ──────────────────────────────────── */
.container {
  max-width: 1100px;
  margin: 24px auto;
  padding: 0 24px;
}

h1 {
  font-size: 18px;
  font-weight: bold;
  color: var(--fg);
  margin-bottom: 4px;
}

.subtitle {
  color: var(--fg_dim);
  font-size: 12px;
  margin-bottom: 20px;
}

/* ── Tables ─────────────────────────────────────────────── */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg0);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 24px;
}

th {
  background: var(--bg2);
  color: var(--fg_dim);
  font-weight: normal;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 10px 14px;
  text-align: left;
}

td {
  padding: 10px 14px;
  border-top: 1px solid var(--bg1);
  vertical-align: middle;
}

tr:hover td { background: var(--bg1); }

/* Disabled profile row styling */
.profile-row.disabled td {
  opacity: 0.45;
}
.profile-row.disabled:hover td {
  background: transparent;
}

/* ── Buttons ────────────────────────────────────────────── */
.btn {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  text-decoration: none;
  transition: all .15s;
}

.btn-primary {
  background: var(--green);
  color: var(--bg0);
}
.btn-primary:hover { opacity: .85; }

.btn-danger {
  background: transparent;
  color: var(--red);
  border-color: var(--red);
}
.btn-danger:hover { background: var(--red); color: var(--bg0); }

.btn-secondary {
  background: var(--bg2);
  color: var(--fg);
}
.btn-secondary:hover { background: var(--bg1); }

.btn-sm { padding: 3px 8px; font-size: 11px; }

/* Toggle button styles */
.toggle-btn:not(.btn-secondary) {
  background: var(--green);
  color: var(--bg0);
}
.toggle-btn:not(.btn-secondary):hover {
  opacity: .85;
}

/* ── Forms ──────────────────────────────────────────────── */
label {
  display: block;
  color: var(--fg_dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 4px;
}

input[type="text"], input[type="number"], input[type="password"],
select, textarea {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg);
  border: 1px solid var(--bg2);
  border-radius: 4px;
  color: var(--fg);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
}

textarea { resize: vertical; }

.form-row { margin-bottom: 14px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

/* ── Status badges ──────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
}

.badge-active { background: var(--green); color: var(--bg0); }
.badge-inactive { background: var(--bg2); color: var(--fg_dim); }

/* ── Log viewer ─────────────────────────────────────────── */
.log-container {
  background: var(--bg0);
  border-radius: 6px;
  padding: 14px;
  font-size: 12px;
  line-height: 1.7;
  max-height: 75vh;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

.log-container .debug   { color: var(--fg_dim); }
.log-container .info    { color: var(--green); }
.log-container .warning { color: var(--yellow); }
.log-container .error   { color: var(--red); }
.log-container .critical{ color: var(--red); font-weight: bold; }

/* ── Toolbar row ────────────────────────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.toolbar select {
  width: auto;
  min-width: 120px;
}

/* ── Modal overlay ──────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  justify-content: center;
  align-items: center;
}

.modal-overlay.visible { display: flex; }

.modal {
  background: var(--bg1);
  border-radius: 8px;
  padding: 24px;
  width: 90%;
  max-width: 650px;
  max-height: 85vh;
  overflow-y: auto;
}

.modal h2 {
  font-size: 15px;
  margin-bottom: 16px;
  color: var(--blue);
}

/* ── Toast notifications ────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 300;
}

.toast {
  background: var(--bg1);
  border-left: 3px solid var(--green);
  padding: 10px 16px;
  margin-top: 8px;
  border-radius: 4px;
  font-size: 12px;
  animation: fadeIn .2s ease;
}

.toast.error { border-left-color: var(--red); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

/* ── Stats row ──────────────────────────────────────────── */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg0);
  border-radius: 6px;
  padding: 14px;
  text-align: center;
}

.stat-card .value {
  font-size: 24px;
  font-weight: bold;
  color: var(--blue);
}

.stat-card .label {
  font-size: 11px;
  color: var(--fg_dim);
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── Model Selection Panel ───────────────────────────── */
.model-panel {
  background: var(--bg0);
  border-radius: 6px;
  padding: 18px;
  margin-bottom: 24px;
  border: 1px solid var(--bg1);
}

.model-panel h2 {
  font-size: 15px;
  color: var(--blue);
  margin-bottom: 2px;
}

.model-panel .subtitle {
  margin-bottom: 14px;
}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 600px) {
  nav { padding: 0 12px; }
  nav .logo { margin-right: 12px; font-size: 13px; }
  nav a { padding: 6px 10px; font-size: 12px; }
  .container { padding: 0 12px; margin: 16px auto; }
  td, th { padding: 8px 10px; font-size: 12px; }
}
</style>
</head>
<body>
<nav>
  <div class="logo">LinguaDaily <span>admin</span></div>
  <a href="/" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
  <a href="/sources" {% if active == 'sources' %}class="active"{% endif %}>Sources</a>
  <a href="/logs" {% if active == 'logs' %}class="active"{% endif %}>Logs</a>
  <a href="/config" {% if active == 'config' %}class="active"{% endif %}>Config</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>

<div class="toast-container" id="toasts"></div>

<!-- ── Add/Edit Profile Modal ───────────────────────────── -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <h2 id="modal-title">Add Profile</h2>
    <form id="profile-form" hx-post="/api/profiles" hx-encoding="multipart/form-data">
      <input type="hidden" name="action" id="form-action" value="add">
      <input type="hidden" name="edit_name" id="form-edit-name" value="">

      <div class="form-grid">
        <div class="form-row">
          <label>Name</label>
          <input type="text" name="name" required placeholder="e.g. krystof">
        </div>
        <div class="form-row">
          <label>Telegram Chat ID</label>
          <input type="text" name="telegram_chat_id" placeholder="e.g. 8218069709">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Native Language (I understand)</label>
          <select name="native_language">
            {% for lang in ['en','de','es','it','hu','cs'] %}
            <option value="{{ lang }}">{{ lang }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-row">
          <label>Learning Language (I want to learn)</label>
          <select name="learning_language">
            {% for lang in ['de','it','es','hu','cs'] %}
            <option value="{{ lang }}">{{ lang }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Source Type</label>
          <select name="source">
            <option value="wikipedia">Wikipedia</option>
            <option value="news">News (RSS)</option>
          </select>
        </div>
        <div class="form-row">
          <label>Schedule Time</label>
          <input type="text" name="schedule_time" placeholder="08:00">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Timezone</label>
          <input type="text" name="schedule_tz" placeholder="Europe/Berlin" value="Europe/Berlin">
        </div>
        <div class="form-row">
          <label>TTS Voice</label>
          <select name="tts_voice">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Min Words</label>
          <input type="number" name="min_words" value="30">
        </div>
        <div class="form-row">
          <label>Max Words</label>
          <input type="number" name="max_words" value="150">
        </div>
      </div>

      <div class="form-row" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" name="enabled" id="profile_enabled" checked style="width:auto;">
        <label for="profile_enabled" style="margin:0;text-transform:none;font-size:13px;color:var(--fg);">Enabled (schedule active)</label>
      </div>

      <div class="form-row" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" name="use_tts" id="use_tts" checked style="width:auto;">
        <label for="use_tts" style="margin:0;text-transform:none;font-size:13px;color:var(--fg);">Enable TTS</label>
      </div>

      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<!-- ── HTMX library (was missing — this was the bug!) ───── -->
<script src="https://unpkg.com/htmx.org@2.0.4"></script>

<script>
// ── Toast notifications ────────────────────────────────
function showToast(msg, isError) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ── Modal helpers ───────────────────────────────────────
function openModal(edit) {
  const modal = document.getElementById('profile-modal');
  const form = document.getElementById('profile-form');
  modal.classList.add('visible');

  if (edit) {
    document.getElementById('modal-title').textContent = 'Edit Profile';
    document.getElementById('form-action').value = 'edit';
    // Populate form fields from data-* attributes on the row
    const row = edit;
    form.querySelector('[name="name"]').value = row.dataset.name || '';
    form.querySelector('[name="telegram_chat_id"]').value = row.dataset.chatId || '';
    form.querySelector('[name="native_language"]').value = row.dataset.nativeLanguage || 'en';
    form.querySelector('[name="learning_language"]').value = row.dataset.learningLanguage || 'de';
    form.querySelector('[name="source"]').value = row.dataset.source || 'wikipedia';
    form.querySelector('[name="schedule_time"]').value = row.dataset.schedTime || '';
    form.querySelector('[name="schedule_tz"]').value = row.dataset.schedTz || 'Europe/Berlin';
    form.querySelector('[name="tts_voice"]').value = row.dataset.ttsVoice || 'male';
    form.querySelector('[name="min_words"]').value = row.dataset.minWords || 30;
    form.querySelector('[name="max_words"]').value = row.dataset.maxWords || 150;
    form.querySelector('[name="use_tts"]').checked = row.dataset.useTts !== 'false';
    form.querySelector('[name="enabled"]').checked = row.dataset.enabled !== 'false';
    document.getElementById('form-edit-name').value = row.dataset.name || '';
  } else {
    document.getElementById('modal-title').textContent = 'Add Profile';
    document.getElementById('form-action').value = 'add';
    document.getElementById('form-edit-name').value = '';
    form.reset();
    form.querySelector('[name="min_words"]').value = 30;
    form.querySelector('[name="max_words"]').value = 150;
    form.querySelector('[name="use_tts"]').checked = true;
    form.querySelector('[name="enabled"]').checked = true;
    form.querySelector('[name="schedule_tz"]').value = 'Europe/Berlin';
  }
}

function closeModal() {
  document.getElementById('profile-modal').classList.remove('visible');
}

// ── HTMX response handling for profile form & toggle ───
document.addEventListener('htmx:afterRequest', function(evt) {
  if (evt.detail.failedSwap) {
    showToast('Save failed — check console', true);
    return;
  }
  const xhr = evt.detail.xhr;
  if (!xhr) return;

  // Determine which endpoint was called
  const path = (evt.detail.requestConfig || {}).path || '';

  if (xhr.status === 200) {
    try {
      const data = JSON.parse(xhr.responseText);

      // ── Toggle profile (POST /api/profiles/:name/toggle) ──
      if (data.enabled !== undefined && path.includes('/toggle')) {
        showToast(data.message || 'Toggled', false);

        const urlParts = path.split('/');
        const toggledName = urlParts[urlParts.length - 2] || '';

        // Update the toggle button text + class
        const btn = document.querySelector(`.toggle-btn[data-profile="${toggledName}"]`);
        if (btn) {
          if (data.enabled) {
            btn.className = 'btn btn-sm toggle-btn';
            btn.textContent = '✓ Enabled';
          } else {
            btn.className = 'btn btn-secondary btn-sm toggle-btn';
            btn.textContent = '✗ Disabled';
          }
          // Ensure hx-post is set correctly
          btn.setAttribute('hx-post', `/api/profiles/${toggledName}/toggle`);
        }

        // Update the row dimming (disabled class)
        const row = document.querySelector(`tr.profile-row[data-name="${toggledName}"]`);
        if (row) {
          if (data.enabled) {
            row.classList.remove('disabled');
          } else {
            row.classList.add('disabled');
          }
        }

        // Hot-reload config in the daemon so scheduler picks up changes
        fetch('/api/reload', { method: 'POST' }).catch(() => {});
        return;
      }

      // ── Profile CRUD (POST /api/profiles) — add/edit ──
      if (path === '/api/profiles') {
        showToast(data.message || 'Saved', false);
        closeModal();
        // Hot-reload config then reload page to reflect changes
        fetch('/api/reload', { method: 'POST' }).then(() => {
          setTimeout(() => location.reload(), 400);
        }).catch(() => {
          setTimeout(() => location.reload(), 400);
        });
        return;
      }

      // ── Delete profile (DELETE /api/profiles/:name) ──
      if (path.startsWith('/api/profiles/')) {
        showToast(data.message || 'Deleted', false);
        fetch('/api/reload', { method: 'POST' }).catch(() => {});
        setTimeout(() => location.reload(), 400);
        return;
      }

      // ── Config save (POST /api/config/save) ──
      if (path === '/api/config/save') {
        showToast(data.message || 'Saved', false);
        // Re-pretty-print the saved content
        const ta = document.getElementById('config-editor');
        if (ta) {
          try {
            const parsed = JSON.parse(data.config_json || ta.value);
            ta.value = JSON.stringify(parsed, null, 2);
          } catch(e) {}
        }
        // Hot-reload config in the daemon
        fetch('/api/reload', { method: 'POST' }).catch(() => {});
        return;
      }

      // ── Sources CRUD (Kiwix servers + RSS feeds) ──
      if (path.startsWith('/api/sources/')) {
        showToast(data.message || 'Saved', false);
        // Close any open modals
        const kiwixModal = document.getElementById('kiwix-modal');
        const feedModal = document.getElementById('feed-modal');
        if (kiwixModal) kiwixModal.classList.remove('visible');
        if (feedModal) feedModal.classList.remove('visible');
        // Hot-reload config then reload page
        fetch('/api/reload', { method: 'POST' }).then(() => {
          setTimeout(() => location.reload(), 400);
        }).catch(() => {
          setTimeout(() => location.reload(), 400);
        });
        return;
      }

    } catch(e) {
      // If not JSON, it's an HTML redirect — just reload
      location.reload();
    }
  } else if (xhr.status >= 400) {
    try {
      const data = JSON.parse(xhr.responseText);
      showToast(data.message || 'Error', true);
    } catch(e) {
      showToast('Save failed', true);
    }
  }
});

// Close modal on overlay click
document.getElementById('profile-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Model Management ─────────────────────────────────────
async function loadModels() {
  const statusEl = document.getElementById('model-status');
  if (!statusEl) return; // not on dashboard

  statusEl.textContent = 'Loading models…';

  try {
    // Fetch available models from the API endpoints
    const fetchRes = await fetch('/api/models/fetch');
    const fetchData = await fetchRes.json();

    if (fetchData.error) {
      statusEl.textContent = `⚠ ${fetchData.error}`;
    }

    // Populate dropdowns
    populateDropdown('model_translate', fetchData.llm_models || []);
    populateDropdown('model_tutor', fetchData.llm_models || []);
    populateDropdown('model_tts', fetchData.tts_models || []);

    // Fetch current selections from config
    const curRes = await fetch('/api/models/current');
    const curData = await curRes.json();

    if (curData.translate_model) {
      document.getElementById('model_translate').value = curData.translate_model;
    }
    if (curData.tutor_model) {
      document.getElementById('model_tutor').value = curData.tutor_model;
    }
    // tts_model always has a default
    document.getElementById('model_tts').value = curData.tts_model || 'omnivoice';

    statusEl.textContent = fetchData.errors?.length
      ? `Loaded (${fetchData.errors.length} endpoint(s) unreachable)`
      : 'Models loaded';
  } catch (e) {
    statusEl.textContent = `⚠ Failed to load models`;;
  }
}

function populateDropdown(id, models) {
  const sel = document.getElementById(id);
  if (!sel) return;
  // Keep the first "→ default" option
  const firstOption = sel.options[0].outerHTML;
  sel.innerHTML = firstOption;
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  }
}

async function saveModels() {
  const statusEl = document.getElementById('model-status');
  if (!statusEl) return;

  statusEl.textContent = 'Saving…';

  const payload = {
    translate_model: document.getElementById('model_translate').value,
    tutor_model: document.getElementById('model_tutor').value,
    tts_model: document.getElementById('model_tts').value,
  };

  try {
    const res = await fetch('/api/models/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (res.ok) {
      statusEl.textContent = `✓ ${data.message || 'Saved'}`;
      showToast(data.message || 'Models saved', false);
    } else {
      statusEl.textContent = `⚠ ${data.message || 'Save failed'}`;
      showToast(data.message || 'Save failed', true);
    }
  } catch (e) {
    statusEl.textContent = '⚠ Network error';
    showToast('Network error saving models', true);
  }
}

// Load models on page load (only when dashboard elements exist)
document.addEventListener('DOMContentLoaded', function() {
  if (document.getElementById('model_translate')) {
    loadModels();
  }
});
</script>
</body>
</html>
